# EchoOrchestrator — Echo Messaging Service stack
#
# Dev:  docker compose up -d             (auto-loads docker-compose.override.yml)
# Prod: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
#
# Production edge model:
#   - Nginx Proxy Manager/openresty on proxy.wisp.net is the canonical TLS/front-door layer
#   - Echo services join shared echo-net so NPM can reverse proxy by container DNS name
#   - localhost-only published ports remain useful for direct service checks/fallback
#
# Configuration model:
#   EchoWeb and EchoService read PlatformConfig/cfg_tbl_Setting directly.
#   Each receives its own NocoDB token; Identity has no shared volume here.
#   Database pools, listener ports and mounted paths remain deployment bootstrap.
#   EchoMedia reads only PORT and MEDIA_ROOT and has no SQL settings dependency.
#   Seed and verify PlatformConfig before deploying this revision (README.md).
#
# Expects sibling repo layout:
#   ../EchoDatabase/   ../EchoService/   ../EchoWeb/   ../EchoMedia/

services:

  # ── Database ───────────────────────────────────────────────────────────────
  echo-database:
    image: mysql:8.4
    container_name: echo-database
    hostname: echo-database
    environment:
      TZ: America/Los_Angeles
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-echo_db}
      MYSQL_USER: ${MYSQL_USER:-echo_app}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - echo_database_data:/var/lib/mysql
      - ../EchoDatabase/init:/docker-entrypoint-initdb.d:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - echo-net

  # ── Schema migrations ──────────────────────────────────────────────────────
  #
  # EchoDatabase's init/ is mounted into the database container at
  # /docker-entrypoint-initdb.d, which MySQL runs ONLY when it initialises an
  # empty data directory. Every numbered file added after the first `up` is
  # silently skipped — which is how 009_settings.sql sat in the repo while a
  # running database had no echo_tbl_Settings, and the apps failed at runtime
  # with something that looked nothing like the cause.
  #
  # So the files are applied here too, in order, against the database as it
  # actually is. Each is recorded in echo_tbl_SchemaMigration after it
  # succeeds, so this is a no-op on every start but the first that sees a new
  # file. The apps wait on it completing.
  echo-migrate:
    image: mysql:8.4
    container_name: echo-migrate
    depends_on:
      echo-database:
        condition: service_healthy
    environment:
      MYSQL_PWD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-echo_db}
    volumes:
      - ../EchoDatabase/init:/init:ro
      - ./scripts/migrate.sh:/migrate.sh:ro
    entrypoint: ["/bin/bash", "/migrate.sh"]
    restart: "no"
    networks:
      - echo-net

  # ── Mid-tier API ───────────────────────────────────────────────────────────
  echo-service:
    build: ../EchoService
    container_name: echo-service
    hostname: echo-service
    environment:
      PORT: "8080"
      SETTINGS_MODE: platform
      DB_HOST: echo-database
      DB_USER: ${MYSQL_USER:-echo_app}
      DB_PASSWORD: ${MYSQL_PASSWORD}
      DB_NAME: ${MYSQL_DATABASE:-echo_db}
      MEDIA_ROOT: /media
      NOCODB_BASE_URL: ${NOCODB_BASE_URL:?Set the PlatformConfig NocoDB URL}
      NOCODB_API_TOKEN: ${ECHO_SERVICE_NOCODB_API_TOKEN:?Set EchoService own NocoDB token}
    depends_on:
      echo-database:
        condition: service_healthy
      echo-migrate:
        condition: service_completed_successfully
    volumes:
      - echo_media_data:/media
      # Keep logs on their own persistent volume across image rebuilds.
      - echo_service_logs:/var/log/echo
    restart: unless-stopped
    networks:
      - echo-net

  # ── Web frontend ───────────────────────────────────────────────────────────
  echo-web:
    build: ../EchoWeb
    container_name: echo-web
    hostname: echo-web
    environment:
      TZ: America/Los_Angeles
      PORT: "3160"
      SETTINGS_MODE: platform
      DB_HOST: echo-database
      DB_USER: ${MYSQL_USER:-echo_app}
      DB_PASSWORD: ${MYSQL_PASSWORD}
      DB_NAME: ${MYSQL_DATABASE:-echo_db}
      NOCODB_BASE_URL: ${NOCODB_BASE_URL:?Set the PlatformConfig NocoDB URL}
      NOCODB_API_TOKEN: ${ECHO_WEB_NOCODB_API_TOKEN:?Set EchoWeb own NocoDB token}
    depends_on:
      echo-database:
        condition: service_healthy
      echo-migrate:
        condition: service_completed_successfully
      echo-service:
        condition: service_started
    restart: unless-stopped
    networks:
      - echo-net

  # ── Media delivery ─────────────────────────────────────────────────────────
  echo-media:
    build: ../EchoMedia
    container_name: echo-media
    hostname: echo-media
    environment:
      PORT: "8082"
      MEDIA_ROOT: /media
    volumes:
      - echo_media_data:/media:ro
    restart: unless-stopped
    networks:
      - echo-net

volumes:
  echo_database_data:
  echo_media_data:
  echo_service_logs:

networks:
  echo-net:
