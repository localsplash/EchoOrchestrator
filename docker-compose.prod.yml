# Production overlay for proxy.wisp.net
#
# Usage: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
#
# Key differences from dev:
#   - Volumes are external (pre-existing on the host)
#   - Network is external (shared with other Docker stacks)
#   - Nginx Proxy Manager/openresty is the canonical edge/front door for Echo domains
#   - echo-web, echo-service, and echo-media publish localhost-only ports for checks/fallback
#   - Set MEDIA_BASE_URL in the echo-web PlatformConfig scope before deployment

services:
  echo-database:
    networks:
      echo-net:
        aliases:
          - echo-database

  echo-service:
    ports:
      - "127.0.0.1:18080:8080"
    networks:
      echo-net:
        aliases:
          - echo-service
      dokku_network:
        aliases:
          - echo-service

  echo-web:
    ports:
      - "127.0.0.1:13160:3160"
    networks:
      echo-net:
        aliases:
          - echo-web
      dokku_network:
        aliases:
          - echo-web

  echo-media:
    ports:
      - "127.0.0.1:18082:8082"
    networks:
      echo-net:
        aliases:
          - echo-media
      dokku_network:
        aliases:
          - echo-media

volumes:
  echo_database_data:
    external: true
    name: echomessagingservice_echo_database_data
  echo_media_data:
    external: true

networks:
  echo-net:
    external: true
  dokku_network:
    external: true
